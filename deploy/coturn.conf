# coturn TURN server for Quick Voice WebRTC media relay.
# Change `user=quickvoice:...` below and keep it in sync with the app
# (Settings -> Wi-Fi calls -> TURN username / password).

listening-port=3478
tls-listening-port=5349
realm=quickvoice
fingerprint
lt-cred-mech

# Long-term credential. Format: username:password
user=quickvoice:change-me

# Relay allocation ports (UDP range).
min-port=49152
max-port=65535

# Keep logging on stdout so docker logs show it.
log-file=stdout
